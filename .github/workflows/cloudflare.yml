name: Deploy to Cloudflare Pages

# Publishes the game to Cloudflare Pages and serves it at SUBDOMAIN.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with  Account › Cloudflare Pages › Edit
#                          and         Zone › DNS › Edit  (atollingo.com)
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown on the Cloudflare dashboard
# Until both are set the job skips itself instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

env:
  PROJECT: scitabletop-arcade
  ZONE: atollingo.com
  SUBDOMAIN: arcade.atollingo.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://${{ env.SUBDOMAIN }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet; skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Collect site files
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p _site
          cp -r index.html css js _site/

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Create the Pages project (first run only)
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main || echo "Project already exists."

      - name: Upload the site
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages deploy _site --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Point the subdomain at the site
        if: steps.check.outputs.ready == 'true'
        run: |
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          # Attach the custom domain to the Pages project (fine if it is already there).
          curl -sS "${auth[@]}" -X POST "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            --data "{\"name\":\"$SUBDOMAIN\"}" | jq -c '{success, errors}'

          # Make sure the DNS record exists in the atollingo.com zone.
          zone_id=$(curl -sS "${auth[@]}" "$api/zones?name=$ZONE" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::Zone $ZONE was not found. Is it on this Cloudflare account, and can the token read it?"
            exit 1
          fi
          existing=$(curl -sS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$SUBDOMAIN" | jq -r '.result | length')
          if [ "$existing" = "0" ]; then
            curl -sS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" \
              --data "{\"type\":\"CNAME\",\"name\":\"$SUBDOMAIN\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" | jq -c '{success, errors}'
          else
            echo "DNS record for $SUBDOMAIN already exists."
          fi

          curl -sS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$SUBDOMAIN" | jq -c '.result | {name, status}'
